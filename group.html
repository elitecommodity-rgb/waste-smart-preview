<meta name="theme-color" content="#0F1A24"><meta name="robots" content="noindex"><script>/* ===================== WSR: report engine =====================
   One report model -> on-screen preview, PDF and Word (.docx). No libraries, no network.

   doc = { title, subtitle, client, period, generated, blocks:[...] }

const WSR = (function(){
  const COL = { ink:'#0F1A24', mute:'#5B6675', line:'#D9DEE5', panel:'#F4F6F8', band:'#0F1A24', accent:'#0B7F72', good:'#2F9E44', bad:'#D9480F', warn:'#B7791F', white:'#FFFFFF', zebra:'#F7F9FB' };

<script>
'use strict';
/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=(n,d=0)=>(Number(n)||0).toLocaleString('en-ZA',{minimumFractionDigits:d,maximumFractionDigits:d});
function R(n){const a=Math.abs(n),s=n<0?'−':'';if(a>=1e9)return s+'R'+nf(a/1e9,2)+'bn';if(a>=1e7)return s+'R'+nf(a/1e6,1)+'m';if(a>=1e6)return s+'R'+nf(a/1e6,2)+'m';return s+'R'+nf(a)}
const pct=(a,b,d=1)=>b>0?nf(a/b*100,d)+'%':'—';
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

/* ============ demo data ============ */
const TYPES=['Restaurant','Quick service','Canteen','Production kitchen','Hotel kitchen','Store'];
const TBASE={'Restaurant':420000,'Quick service':310000,'Canteen':260000,'Production kitchen':180000,'Hotel kitchen':520000,'Store':150000};
const PROV={
 'Gauteng':['Johannesburg North','Johannesburg South','Pretoria East','Pretoria West','Sandton','Ekurhuleni','Vaal'],
 'Western Cape':['Cape Town CBD','Southern Suburbs','Northern Suburbs','Winelands','Garden Route'],
 'KwaZulu-Natal':['Durban Central','Umhlanga','Pietermaritzburg','Richards Bay','South Coast'],
 'Eastern Cape':['Gqeberha','East London','Mthatha'],
 'Free State':['Bloemfontein','Welkom'],
 'Limpopo':['Polokwane','Tzaneen'],
 'Mpumalanga':['Mbombela','Emalahleni'],
 'North West':['Rustenburg','Mahikeng'],
 'Northern Cape':['Kimberley','Upington']};
const WEIGHT={'Gauteng':.32,'Western Cape':.2,'KwaZulu-Natal':.18,'Eastern Cape':.08,'Free State':.05,'Limpopo':.05,'Mpumalanga':.05,'North West':.04,'Northern Cape':.03};
function build(kind){
  if(kind==='b'&&window.WS_GROUP_DATA)return JSON.parse(JSON.stringify(window.WS_GROUP_DATA));   // measured data from a test run (see the scenario pack)
  const r=rng(kind==='e'?7:kind==='m'?21:3), D={regions:[],areas:[],sites:[],users:[],id:1};
  let name,brands,provs,total;
  if(kind==='s'){name='Harbour Hospitality (Pty) Ltd';brands=['Harbour Street Kitchen','The Anchor Grill','Bayside Canteen'];provs={'KwaZulu-Natal':['Durban Central','Umhlanga']};total=3}
  else if(kind==='m'){name='Coastal Dining Group';brands=['Coastal Grill','Bay Café','Tide Kitchen','Harvest Canteen'];provs={'Western Cape':PROV['Western Cape'],'KwaZulu-Natal':PROV['KwaZulu-Natal'],'Eastern Cape':PROV['Eastern Cape']};total=48}
  else{name='Meridian Holdings Ltd (JSE: MRD)';brands=['Meridian Grill','Quick Fork','Meridian Canteen','Central Kitchen','Meridian Hotels','Meridian Express','Meridian Fresh'];provs=PROV;total=3000}
  Object.keys(provs).forEach(p=>{const rid='r'+D.id++;D.regions.push({id:rid,name:p});provs[p].forEach(a=>D.areas.push({id:'a'+D.id++,name:a,rid}))});
  const areaPick=[];D.areas.forEach(a=>{const rn=D.regions.find(x=>x.id===a.rid).name;const w=(WEIGHT[rn]||1/D.regions.length)/provs[rn].length;areaPick.push([a,w])});
  const sum=areaPick.reduce((x,y)=>x+y[1],0);
  for(let i=0;i<total;i++){
    let t=r()*sum,a=areaPick[0][0];for(const [ar,w] of areaPick){t-=w;if(t<=0){a=ar;break}}
    let brand,type;
    if(kind==='s'){brand=brands[i];type=['Restaurant','Restaurant','Canteen'][i]}
    else{const bi=Math.floor(r()*brands.length);brand=brands[bi];type=/Canteen/.test(brand)?'Canteen':/Central/.test(brand)?'Production kitchen':/Hotel/.test(brand)?'Hotel kitchen':/Quick|Express/.test(brand)?'Quick service':/Fresh/.test(brand)?'Store':'Restaurant'}
    const n=D.sites.filter(s=>s.aid===a.id).length+1;
    const roll=r(), status=kind==='s'?(i===2?'Onboarding':'Live'):(roll<.04?'Onboarding':roll<.06?'Paused':'Live');
    const q=.7+r()*.7, bad=r()<.08;
    D.sites.push({id:'s'+(i+1),code:'WS-'+String(i+1).padStart(4,'0'),name:kind==='s'?brand:`${brand} ${a.name.replace(/^(Johannesburg|Pretoria|Cape Town|Durban) /,'')} ${n}`,type,rid:a.rid,aid:a.id,status,
      rev:TBASE[type]*q*(kind==='s'?1:.9+r()*.3),fw:.035+r()*.03+(bad?.03:0),el:.012+r()*.012,gs:.007+r()*.008,wt:.003+r()*.004,col:.005+r()*.006,rc:.0004+r()*.0012,lk:.006+r()*.012+(bad?.012+r()*.03:0),pf:(r()-.4)*.28,
      dev:[r()>.03,r()>.04,r()>.06,r()>.05,type==='Store'||r()>.04],pos:r()>.05});
  }
  if(kind==='s'){D.sites[0].lk=.034;D.sites[0].fw=.075;D.sites[1].fw=.05}
  D.name=name;D.kind=kind;return D;
}

/* ============ model ============ */
const PER={mtd:{k:'Month to date',f:.71},prior:{k:'Prior month',f:1},d90:{k:'90 days',f:3},ytd:{k:'Year to date',f:9.7}};
const S={D:null,tab:'portfolio',site:null,ap:30,per:'mtd',reg:null,area:null,sort:{k:'leak',dir:-1},sq:'',fr:'',fa:'',ft:'',fs:'',page:0,ssort:{k:'name',dir:1},M:null};
function metrics(s,f){
  if(s.status!=='Live')return{rev:0,cost:0,recov:0,leak:0,prev:0,live:0,dOn:s.status==='Onboarding'?0:0,dTot:5};
  const rev=s.rev*f,cost=rev*(s.fw+s.el+s.gs+s.wt+s.col);
  const dOn=s.dev.filter(Boolean).length;
  return{rev,cost,recov:rev*s.rc,leak:rev*s.lk,prev:cost/(1+s.pf),live:1,dOn,dTot:5,food:rev*s.fw,elec:rev*s.el,gas:rev*s.gs,water:rev*s.wt,collect:rev*s.col};
}
function compute(){S.M=new Map();const f=PER[S.per].f;S.D.sites.forEach(s=>S.M.set(s.id,metrics(s,f)))}
function agg(list){const a={n:list.length,live:0,onb:0,rev:0,cost:0,recov:0,leak:0,prev:0,dOn:0,dTot:0,nPos:0};
  list.forEach(s=>{const m=S.M.get(s.id);if(s.status==='Onboarding')a.onb++;if(m.live){a.live++;a.rev+=m.rev;a.cost+=m.cost;a.recov+=m.recov;a.leak+=m.leak;a.prev+=m.prev;a.dOn+=m.dOn;a.dTot+=m.dTot;if(!s.pos)a.nPos++}});
  a.net=a.rev-a.cost+a.recov;a.dPct=a.prev>0?(a.cost-a.prev)/a.prev*100:null;return a}
const reg=id=>S.D.regions.find(r=>r.id===id),area=id=>S.D.areas.find(a=>a.id===id);
function scoped(){return S.D.sites.filter(s=>(!S.reg||s.rid===S.reg)&&(!S.area||s.aid===S.area))}
const dlt=d=>d==null?'<span class="mu">—</span>':Math.abs(d)<1?'<span class="mu">0%</span>':`<span class="${d>0?'bad':'good'}">${d>0?'+':'−'}${nf(Math.abs(d),0)}%</span>`;

/* ============ views ============ */
function render(){
  document.querySelectorAll('#tabs .tab').forEach(b=>b.toggleAttribute('aria-current',false)||(b.dataset.t===S.tab&&b.setAttribute('aria-current','page')));
  $('#grpName').textContent=S.D.name;
  $('#main').innerHTML=({portfolio:vPortfolio,daily:vDaily,analysis:vAnalysis,sustain:vSustain,reports:vReports,integr:vIntegr,sites:vSites,structure:vStructure,admin:vAdmin})[S.tab]();
  if(S.tab==='sites')bindSites();
}
function periodSeg(){return `<div class="seg" role="group" aria-label="Period">${Object.entries(PER).map(([k,v])=>`<button class="${S.per===k?'on':''}" onclick="setPer('${k}')">${v.k}</button>`).join('')}</div>`}
function setPer(k){S.per=k;compute();render()}

function vPortfolio(){
  const all=agg(scoped()),G=agg(S.D.sites);
  const scopeName=S.area?area(S.area).name:S.reg?reg(S.reg).name:S.D.name;
  const crumbs=`<div class="crumb"><button onclick="drill()">${esc(S.D.name)}</button>${S.reg?`<span>›</span>${S.area?`<button onclick="drill('${S.reg}')">${esc(reg(S.reg).name)}</button><span>›</span><b>${esc(area(S.area).name)}</b>`:`<b>${esc(reg(S.reg).name)}</b>`}`:''}</div>`;
  // explorer rows
  let rows,level;
  if(!S.reg){level='Region';rows=S.D.regions.map(r=>({id:r.id,name:r.name,sub:S.D.areas.filter(a=>a.rid===r.id).length+' areas',list:S.D.sites.filter(s=>s.rid===r.id)}))}
  else if(!S.area){level='Area';rows=S.D.areas.filter(a=>a.rid===S.reg).map(a=>({id:a.id,name:a.name,sub:'',list:S.D.sites.filter(s=>s.aid===a.id)}))}
  else{level='Site';rows=null}
  let body;
  if(rows){
    rows.forEach(r=>{r.a=agg(r.list)});
    const k=S.sort.k,dir=S.sort.dir,val={name:r=>r.name.toLowerCase(),sites:r=>r.a.n,rev:r=>r.a.rev,cost:r=>r.a.rev?r.a.cost/r.a.rev:0,leak:r=>r.a.leak,leakp:r=>r.a.rev?r.a.leak/r.a.rev:0,d:r=>r.a.dPct??-999,dev:r=>r.a.dTot?r.a.dOn/r.a.dTot:0}[k];
    rows.sort((x,y)=>(val(x)>val(y)?1:val(x)<val(y)?-1:0)*dir);
    const mxc=Math.max(.001,...rows.map(r=>r.a.rev?r.a.cost/r.a.rev:0));
    const th=(k,l,c='')=>`<button class="${S.sort.k===k?'s '+(S.sort.dir>0?'up':''):''}" onclick="sortBy('${k}')">${l}</button>`;
    body=`<div class="tbl"><div class="tr th cols-x"><span>${th('name',level)}</span><span class="r hm">${th('sites','Sites')}</span><span class="r hm">${th('rev','Revenue')}</span><span>${th('cost','Cost % revenue')}</span><span class="r">${th('leak','Leakage')}</span><span class="r hm">${th('leakp','% rev')}</span><span class="r hm">${th('d','vs prior')}</span><span class="r hm">${th('dev','Devices')}</span></div>`+
    rows.map(r=>{const a=r.a,cp=a.rev?a.cost/a.rev:0,dv=a.dTot?a.dOn/a.dTot*100:0;return `<div class="tr rw cols-x" onclick="${level==='Region'?`drill('${r.id}')`:`drill('${S.reg}','${r.id}')`}"><div class="nm">${esc(r.name)}<small>${a.n} site${a.n===1?'':'s'}${a.onb?' · '+a.onb+' onboarding':''}${a.rev?' · '+R(a.rev):''}</small></div><span class="r hm">${nf(a.n)}</span><span class="r hm">${a.rev?R(a.rev):'—'}</span><span class="bar"><span class="tk"><i style="width:${Math.min(100,cp/.14*100)}%"></i></span><span>${a.rev?nf(cp*100,1)+'%':'—'}</span></span><span class="r bad">${a.leak?R(a.leak):'—'}</span><span class="r hm mu">${pct(a.leak,a.rev)}</span><span class="r hm">${dlt(a.dPct)}</span><span class="r hm ${dv<90?'warn':'good'}">${a.dTot?nf(dv,0)+'%':'—'}</span></div>`}).join('')+`</div>`;
  } else {
    const list=siteSorted(scoped(),{k:'leak',dir:-1}).slice(0,100);
    body=siteTable(list)+(scoped().length>100?`<div class="note">Top 100 by leakage shown. Use the Sites tab to filter all ${nf(scoped().length)}.</div>`:'');
  }
  // needs attention
  const att=scoped().filter(s=>S.M.get(s.id).live).map(s=>({s,m:S.M.get(s.id)})).sort((x,y)=>y.m.leak/y.m.rev-x.m.leak/x.m.rev).slice(0,8);
  const offl=scoped().filter(s=>s.status==='Live'&&s.dev.some(d=>!d)).length;
  return `<div class="head"><div><div class="eyebrow">Group executive summary</div><h1>${esc(scopeName)} portfolio position</h1><p class="sub">${PER[S.per].k} · ${nf(all.n)} site${all.n===1?'':'s'} in scope (${nf(all.live)} live). Compared with the prior period.</p></div>${periodSeg()}</div>
  <div class="kpis"><div class="kpi net"><div class="l">Net contribution</div><div class="n">${R(all.net)}</div><div class="s">${pct(all.net,all.rev)} of revenue</div></div>
   <div class="kpi"><div class="l">Revenue</div><div class="n">${R(all.rev)}</div><div class="s">${all.live?R(all.rev/all.live)+' per live site':'No live sites'}</div></div>
   <div class="kpi"><div class="l">Cost of operations</div><div class="n">${R(all.cost)}</div><div class="s">${pct(all.cost,all.rev)} of revenue · ${all.dPct==null?'—':(all.dPct>=0?'+':'−')+nf(Math.abs(all.dPct),1)+'% vs prior'}</div></div>
   <div class="kpi leak"><div class="l">Controllable leakage</div><div class="n">${R(all.leak)}</div><div class="s" style="color:var(--mute)">${pct(all.leak,all.rev)} of revenue</div></div>
   <div class="kpi"><div class="l">Sites live</div><div class="n">${nf(all.live)}<span style="font-size:.55em;color:var(--mute);font-weight:600"> / ${nf(all.n)}</span></div><div class="s">${all.onb} onboarding</div></div></div>
  <div class="layout"><div class="card"><div class="hd"><h3>${rows?(level==='Region'?'Regional performance':'Areas in '+esc(reg(S.reg).name)):'Sites in '+esc(area(S.area).name)}</h3><small>${rows?'Select a row to drill down':'Select a site for detail'}</small></div>${crumbs}${body}</div>
  <div class="side"><div class="card"><div class="hd"><h3>Needs attention</h3><small>Highest leakage, % of revenue</small></div>${att.length?att.map(({s,m})=>`<div class="li" onclick="openSite('${s.id}')"><div><b>${esc(s.name)}</b><small>${esc(reg(s.rid).name)} › ${esc(area(s.aid).name)}</small></div><div class="v">${R(m.leak)}<small> ${nf(m.leak/m.rev*100,1)}%</small></div></div>`).join(''):'<div class="empty">No live sites in scope.</div>'}</div>
  <div class="card"><div class="hd"><h3>Coverage</h3><small>Data completeness</small></div><div class="cov">

function dayData(s,di){
  if(s.status!=='Live')return null;
  const n=snum(s),f=WDF[s.type][wdOf(di)]*(.85+hh(n,di*13+1)*.3),sp=hh(n,di*13+2)<.03?2.4:1,sales=s.rev/30*f;
  const w=s.rev*s.fw/28/30*f*sp*(.9+hh(n,di*13+3)*.2)*(1+di*.0012),nz=k=>.85+hh(n,di*13+k)*.3,pr=(.55+hh(n,70)*1.0)*(1.12-di*.0016);
  return {sales,covers:sales/165,waste:w,plastic:w*.12*nz(4)*pr,paper:w*.32*nz(5)*pr,glass:w*.18*nz(6)*pr,cans:w*.05*nz(7)*pr,oil:s.rev/30*.0006*f*nz(8),kwh:s.rev*s.el/2.4/30*nz(9),gas:s.rev*s.gs/32/30*nz(10),water:s.rev*s.wt/38*1000/30*nz(11)};

function chartSvg(vals,rec,color){
  const W=Math.max(300,Math.min(1000,innerWidth-70)),H=190,L=44,B=24,T=8,iw=W-L-6,ih=H-T-B,n=vals.length,slot=iw/n,bw=Math.max(2,Math.min(26,slot*.7));

  return s+'</svg>'}

  <div class="kpis auto"><div class="kpi net"><div class="l">Diverted from landfill</div><div class="n">${nf(cur.rec/1000,1)} t</div><div class="s">${nf(cur.rec/(cur.waste+cur.rec||1)*100,0)}% of all weighed</div></div><div class="kpi"><div class="l">Water saved</div><div class="n">${nf(cur.rec*CFG.wLpk/1000,0)} kL</div></div><div class="kpi"><div class="l">Trees equivalent</div><div class="n">${nf(cur.rec*CFG.trees,0)}</div></div><div class="kpi"><div class="l">Disposal cost now</div><div class="n">${R(nowCost)}</div></div><div class="kpi ${save>=0?'net':'leak'}"><div class="l">${save>=0?'Saved vs baseline':'Above baseline'}</div><div class="n">${R(Math.abs(save))}</div></div></div>

  doc.blocks.push({t:'h2',text:'Waste and recycling',sub:'Everything weighed across the sites in scope.'},{t:'kpis',items:[{label:'Kitchen waste',value:kg(cur.waste),sub:dl(cur.waste,prev.waste)==null?'':(dl(cur.waste,prev.waste)>=0?'+':'-')+nf(Math.abs(dl(cur.waste,prev.waste)),0)+'% vs prior',tone:cur.waste>prev.waste?'bad':'good',color:GC.waste},{label:'Recycled',value:kg(cur.rec),sub:dl(cur.rec,prev.rec)==null?'':(dl(cur.rec,prev.rec)>=0?'+':'-')+nf(Math.abs(dl(cur.rec,prev.rec)),0)+'% vs prior',tone:cur.rec>=prev.rec?'good':'bad',color:GC.good},{label:'Used cooking oil',value:kg(cur.oil),sub:'Collected',color:GC.oil},{label:'Water saved',value:nf(cur.rec*CFG.wLpk/1000,0)+' kL',sub:'Through recycling',color:GC.water}]},...grpWaste(sites,d));

  return doc;
}

  <div class="card"><div class="hd"><h3>Environmental factors</h3></div><div class="frm">${f('e_w','Litres of water saved per kg',CFG.wLpk,'number','any')}${f('e_t','Trees saved per kg',CFG.trees,'number','any')}</div><button class="btn pri" onclick="saveCfg('env')">Save factors</button><div class="hd" style="margin-top:20px"><h3>Look</h3></div><p class="sub" style="margin:0">Executive Dark is active. The site app also offers Control Room, Fresh, Stainless, Boardroom, Midnight and Terracotta under its own Administration page.</p></div></div>
  <div class="card" style="margin-bottom:24px"><div class="hd"><h3>Tariffs by region</h3><small>Group default, with a regional override where a municipality differs</small></div><div class="frm" style="grid-template-columns:repeat(3,minmax(0,1fr))">${f('t_e','Group electricity per kWh',CFG.kwh)}${f('t_g','Group gas per kg',CFG.gas)}${f('t_w','Group water per kL',CFG.water)}</div>
  <div class="sc"><table><thead><tr><th>Region</th><th>Electricity / kWh</th><th>Gas / kg</th><th>Water / kL</th></tr></thead><tbody>${S.D.regions.map(r=>{const o=OVR[r.id]||{};return `<tr><td>${esc(r.name)}</td>${['e','g','w'].map(k=>`<td><input style="min-height:36px;padding:4px 8px;font-size:14px" inputmode="decimal" placeholder="group" value="${o[k]??''}" onchange="(OVR['${r.id}']=OVR['${r.id}']||{}).${k}=this.value" aria-label="${esc(r.name)} ${k}"></td>`).join('')}</tr>`}).join('')}</tbody></table></div><button class="btn pri" style="margin-top:12px" onclick="saveCfg('tariffs')">Save tariffs</button></div>`;
}
function saveCfg(w){const g=id=>parseFloat($('#'+id)?.value);
  if(w==='profile'){S.D.name=$('#c_biz').value||S.D.name;CFG.cur=$('#c_cur').value||'R';CFG.tz=$('#c_tz').value||CFG.tz}
  if(w==='values'){CFG.plastic=g('v_pl');CFG.paper=g('v_pa');CFG.glass=g('v_gl');CFG.cans=g('v_ca');CFG.oil=g('v_oi');CFG.foodCost=g('v_fc');CFG.flagPct=g('v_fp')}
  if(w==='disposal'){CFG.provider=$('#d_p').value;CFG.muniBase=g('d_mb');CFG.muniRate=g('d_mr');CFG.privBase=g('d_pb');CFG.privRate=g('d_pr');CFG.baseline=g('d_bl')}
  if(w==='env'){CFG.wLpk=g('e_w');CFG.trees=g('e_t')}
  if(w==='tariffs'){CFG.kwh=g('t_e');CFG.gas=g('t_g');CFG.water=g('t_w')}
  render();toast('Saved (demo)')}

/* ============ boot ============ */
function load(k){S.D=build(k);S.reg=S.area=S.site=null;S.fr=S.fa=S.ft=S.fs=S.sq='';S.page=0;compute();render()}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b){S.tab=b.dataset.t;render();window.scrollTo(0,0)}});
$('#dsSel').addEventListener('change',e=>load(e.target.value));

/* ============ live mode (production group.html): sign in against group.php and show the group's measured data ============ */
const GP=window.WS_GROUP_API||'group.php', GK='ws_group_token';
async function gcall(action,body,tok){const r=await fetch(GP,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},tok?{Authorization:'Bearer '+tok}:{}),body:JSON.stringify(Object.assign({action},body||{}))});let j={};try{j=await r.json()}catch(e){}return{ok:r.ok,status:r.status,j}}
function glogin(msg){
  document.body.style.overflow='hidden';
  $('#layer').innerHTML=`<div class="ov c"><div class="card" style="max-width:380px;width:100%"><div class="hd"><h3>Sign in to your group</h3></div><p class="sub" style="margin-top:0">Multi user / corporate. Use the email and password Gilded Age Consulting set up for your group.</p><div class="frm"><div class="fld"><label for="gl_e">Email</label><input id="gl_e" type="email" autocomplete="username"></div><div class="fld"><label for="gl_p">Password</label><input id="gl_p" type="password" autocomplete="current-password"></div></div><p id="gl_m" class="sub" style="color:var(--bad,#d33)">${esc(msg||'')}</p><button class="btn pri" id="gl_b">Sign in</button><p class="sub">Forgotten your password? Contact Gilded Age Consulting via www.gildedac.co.za</p></div></div>`;
  const go=async()=>{$('#gl_b').disabled=true;const r=await gcall('login',{email:$('#gl_e').value,password:$('#gl_p').value});if(r.ok&&r.j.token){try{sessionStorage.setItem(GK,r.j.token)}catch(e){}$('#layer').innerHTML='';document.body.style.overflow='';gload()}else{$('#gl_m').textContent=r.j.error||'Could not sign in.';$('#gl_b').disabled=false}};
  $('#gl_b').onclick=go;$('#gl_p').onkeydown=e=>{if(e.key==='Enter')go()};$('#gl_e').focus();
}
async function gload(){
  let t='';try{t=sessionStorage.getItem(GK)||''}catch(e){}
  if(!t)return glogin();
  $('#main').innerHTML='<p class="sub" style="padding:40px 0">Loading your group…</p>';
  const r=await gcall('data',{},t);
  if(r.status===401){try{sessionStorage.removeItem(GK)}catch(e){}return glogin('Please sign in again.')}
  if(!r.ok)return $('#main').innerHTML='<p class="sub">'+esc(r.j.error||'The group service is not reachable.')+'</p>';
  window.WS_GROUP_DATA=r.j;S.D=r.j;S.reg=S.area=S.site=null;S.fr=S.fa=S.ft=S.fs=S.sq='';S.page=0;compute();render();
  const nb=r.j.noRatesSites||0;if(nb){const d=document.querySelector('.demo');if(d)d.insertAdjacentHTML('afterbegin',`<b style="margin-right:10px">${nb} of ${r.j.sites.length} sites have no tariffs or rates set, so their costs are understated (not estimated). Set them in each site's Administration page.</b>`)}
}
if(window.WS_GROUP_LIVE){
  const msg=()=>toast('Sites, structure and rates for your group are managed by Gilded Age Consulting (www.gildedac.co.za).');
  nodeForm=siteForm=bulkImport=saveCfg=msg;
  const d=document.querySelector('.demo');if(d)d.innerHTML='<a href="app.html">Site app</a> · <a href="#" onclick="try{sessionStorage.removeItem(\'ws_group_token\')}catch(e){}location.reload();return false">Sign out</a>';
  const ds=$('#dsSel');if(ds)ds.style.display='none';
  S.D={name:'',regions:[],areas:[],sites:[],users:[]};compute();gload();
} else if(window.WS_GROUP_DATA){const o=document.createElement('option');o.value='b';o.textContent=window.WS_GROUP_DATA.optionLabel||'Measured test run';$('#dsSel').insertBefore(o,$('#dsSel').firstChild);$('#dsSel').value='b';load('b')}else load('e');
</script></body></html>
